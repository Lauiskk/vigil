# The whole pipeline, one command. Redpanda rather than Kafka: it speaks the
# same protocol, runs in about a gigabyte instead of four, and needs no JVM and
# no ZooKeeper — which is the difference between `docker compose up` working on
# a laptop and not.
name: vigil

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.5
    container_name: vigil_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      # Loopback only. The broker is never reachable from outside this machine.
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    volumes:
      - vigil_redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  generator:
    build:
      context: .
      args:
        SERVICE: generator
    container_name: vigil_generator
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      GEN_ADDR: ":8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redpanda:
        condition: service_healthy

  processor:
    build:
      context: .
      args:
        SERVICE: processor
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_GROUP: vigil-processor
      PROC_ADDR: ":8082"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # A range, because `docker compose up --scale processor=2` is the whole
      # rebalance demonstration and a fixed port would forbid it.
      - "127.0.0.1:8082-8083:8082"
    depends_on:
      redpanda:
        condition: service_healthy

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    container_name: vigil_gateway
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      GENERATOR_URL: http://generator:8081
      GATEWAY_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # The Kafka Streams topology: tumbling aggregation over the event stream
  # into vigil.metrics. It is Java because Kafka Streams is Java — see
  # docs/decisions/0001 for why the detection path is not.
  streams:
    build:
      context: ./streams
    container_name: vigil_streams
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      APPLICATION_ID: vigil-streams
      WINDOW_SECONDS: "10"
      GRACE_SECONDS: "5"
    depends_on:
      redpanda:
        condition: service_healthy

  # The AWS tier, behind a profile: `docker compose --profile aws up`.
  #
  # LocalStack provides Lambda, DynamoDB, IAM, CloudWatch Logs and Secrets
  # Manager locally, so the handler and the Terraform that provisions it are
  # both exercised without an AWS account existing. infra/terraform applies
  # against this or against real AWS from the same files.
  localstack:
    image: localstack/localstack:3.8
    container_name: vigil_localstack
    profiles: ["aws"]
    restart: unless-stopped
    environment:
      SERVICES: lambda,dynamodb,iam,logs,sts,secretsmanager
      DEBUG: "0"
      LAMBDA_KEEPALIVE_MS: "300000"
      # LocalStack starts a container per Lambda invocation, so it needs the
      # daemon it is itself running under.
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vigil_localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"lambda\": \"available\"'"]
      interval: 6s
      timeout: 5s
      retries: 30
      start_period: 25s

  # Bridges vigil.alerts into Lambda.
  #
  # In AWS this process does not exist: a self-managed Kafka event source
  # mapping has Lambda poll the topic itself (infra/terraform/esm.tf).
  # LocalStack's free tier does not implement that event source, so locally
  # the bridge is explicit. The handler accepts both shapes.
  forwarder:
    build:
      context: .
      args:
        SERVICE: forwarder
    container_name: vigil_forwarder
    profiles: ["aws"]
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_GROUP: vigil-forwarder
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ALERTS_FUNCTION: vigil-alerts
    depends_on:
      redpanda:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # Redpanda's own web UI: topics, partitions, consumer groups, and the
  # dead-letter contents. `docker compose --profile ui up`.
  console:
    image: redpandadata/console:v3.4.0
    container_name: vigil_console
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  vigil_redpanda:
    name: vigil_redpanda
  vigil_localstack:
    name: vigil_localstack
