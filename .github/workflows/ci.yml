name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first; there is no value in
# finishing a run whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go — vet, race tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matched to go.mod. aws-lambda-go requires 1.26.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race -count=1

      # The five packages above the Kafka line hold pure logic and are
      # decidable without a broker, so anything uncovered in them is untested
      # by choice. The gate says so out loud rather than trusting a habit.
      - name: coverage gate
        run: |
          go test ./internal/domain/... ./internal/rules/... ./internal/window/... \
                  ./internal/state/... ./internal/engine/... \
                  -covermode=atomic -coverprofile=coverage.out -count=1
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "pure-package coverage: ${pct}%"
          awk -v got="$pct" 'BEGIN { exit !(got >= 100) }' || {
            echo "::error::coverage ${pct}% is below the required 100%"
            go tool cover -func=coverage.out | awk '$3 != "100.0%"'
            exit 1
          }

      - name: build every binary
        run: |
          for cmd in ./cmd/*; do
            go build -o /dev/null "$cmd"
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./lambda/alerts

  integration:
    name: go — against a real broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Brought up through the repo's own compose file rather than a `services:`
      # block. A service container cannot be given a command, and the Redpanda
      # image needs `redpanda start --mode dev-container` — and this way the
      # compose file that everyone else runs is itself under test.
      - name: start the broker
        run: |
          docker compose up -d redpanda
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' vigil_redpanda)" = healthy ]; then
              echo "broker healthy after ${i} checks"; exit 0
            fi
            sleep 4
          done
          echo "::error::the broker never became healthy"
          docker compose logs redpanda
          exit 1

      - name: integration tests
        env:
          KAFKA_BROKERS: localhost:19092
        run: go test ./internal/stream/... -race -count=1 -tags integration -v

      - name: broker logs on failure
        if: failure()
        run: docker compose logs redpanda

  java:
    name: java — kafka streams topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: test
        working-directory: streams
        run: mvn -B test

      - name: package
        working-directory: streams
        run: mvn -B -DskipTests package

  terraform:
    name: terraform — fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -diff

      - name: validate
        run: |
          # archive_file needs its source to exist before validate will run.
          mkdir -p dist && touch dist/bootstrap
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  images:
    name: images — build and publish to ghcr
    runs-on: ubuntu-latest
    # Only from main, and only once the code that goes in them is green.
    # A pull request should not publish anything, and building five images on
    # every branch push is minutes nobody gets back.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, java]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: generator
            context: .
            dockerfile: Dockerfile
            build-args: SERVICE=generator
          - service: processor
            context: .
            dockerfile: Dockerfile
            build-args: SERVICE=processor
          - service: gateway
            context: .
            dockerfile: Dockerfile
            build-args: SERVICE=gateway
          - service: forwarder
            context: .
            dockerfile: Dockerfile
            build-args: SERVICE=forwarder
          # The JVM topology has its own context and its own base image, for
          # the glibc reason recorded in streams/Dockerfile.
          - service: streams
            context: ./streams
            dockerfile: streams/Dockerfile
            build-args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vigil-${{ matrix.service }}
          # No `latest`. An image tagged latest means the running version is
          # whatever the registry answered when each pod happened to start,
          # and two replicas of one Deployment can be different builds. The
          # commit sha is the tag; the digest is what a manifest should pin.
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
