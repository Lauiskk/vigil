# Kafka logs its full effective configuration at INFO on every client it
# builds — several hundred lines before the service has done anything. Useful
# once, noise thereafter, and it buries the topology description that is
# actually worth reading on start-up.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.org.apache.kafka=warn
# The dump comes from AbstractConfig, and StreamsConfig is one — so raising
# org.apache.kafka.streams as a whole puts it straight back. Only the client's
# own lifecycle is wanted: created, rebalancing, running, shut down.
org.slf4j.simpleLogger.log.org.apache.kafka.streams.KafkaStreams=info
org.slf4j.simpleLogger.log.dev.luisfelipe.vigil=info

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
